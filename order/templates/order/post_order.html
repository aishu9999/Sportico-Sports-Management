{% extends 'temp/User.html' %}
{% block base %}
<!DOCTYPE html>
<html>
<head>
	<title>ORDER</title>
</head>
<body>
<center>
	<h1>ORDER</h1>
<form method="post">
    {% csrf_token %}
	<table>
		<tr>
			<td>SHOP NAME</td>
		<td><SELECT name="sh" required="">
        {% for i in x %}
            <option value="{{ i.shop_id }}">{{ i.shop_name }}</option>
            {% endfor %}
        </SELECT></td>
	</tr>
	<tr>
			<td>ITEM </td>
		<td><SELECT name="it" required="">
        {% for i in x %}
            <option value="{{ i.shop_id }}">{{ i.item_name}}</option>
            {% endfor %}
        </SELECT></td>
	</tr>
	<tr>
			<td>PAYMENT </td>
		<td><SELECT name="py" required="">
         {% for i in y %}
            <option value="{{ i.payment_id }}">{{i.amount}}</option>
            {% endfor %}
        </SELECT></td>
</tr>


<tr>
			<td></td>
			<td><input type="submit" name="submit" value="submit"></td>
		</tr>
		</table>
	</form>
</center>
</body>
</html>
{% endblock %}
