{% extends 'temp/Club Manager.html' %}
{% block base %}
<!DOCTYPE html>
<html>
<head>
	<title>TURF REGISTER</title>
</head>
<body>
<center>
	<h1>TURF REGISTER</h1>
<form method="post">
    {% csrf_token %}
	<table>
		<tr>
			<td>NAME</td>
		<td><input type="text" name="name" class="form-control" placeholder="Turf Name" required=""></td>
	    </tr>
        <tr>
			<td>PLACE</td>
		    <td><input type="text" name="place" class="form-control" placeholder="Place" required=""></td>
		<tr>
			<td>EMAIL ID</td>
		    <td><input type="text" name="email" class="form-control" placeholder="E-Mail" required=""></td>
        </tr>
        <tr>
			<td>CONTACT</td>
		<td><input type="text" name="contactno" required="" pattern="[0-9]" class="form-control" placeholder="Contact No"></td>
        </tr>

        <tr>
			<td>AMOUNT</td>
		<td><input type="number" name="amount" required="" class="form-control" placeholder="Fee"></td>
	    </tr>

        <tr>
			<td>LATITUDE</td>
		    <td><input type="text" name="lat" required="" class="form-control" placeholder="Latitude"></td>
	    </tr>
        <tr>
			<td>LONGTITUDE</td>
		    <td><input type="text" name="lon" required="" class="form-control" placeholder="Longitude"></td>
	    </tr>
        <tr>
			<td></td>
			<td><input type="submit" class="form-control btn-primary p-2" value="submit"></td>
		</tr>
		</table>
      {% if msg %}
    <script>
        alert('successfully registered')
    </script>
    {% endif %}
	</form>
</center>
</body>
</html>
{% endblock %}
