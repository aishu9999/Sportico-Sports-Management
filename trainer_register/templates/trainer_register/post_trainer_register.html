{% extends 'temp/Club Manager.html' %}
{% block base %}
<!DOCTYPE html>
<html>
<head>
	<title>TRAINER REGISTER</title>
</head>
<body>
<center>
	<h1>TRAINER REGISTER</h1>
<form method="post">
    {% csrf_token %}
	<table style="width: 350px;">
		<tr>
			<td>NAME</td>
		<td><input type="text" name="name" class="form-control" placeholder="Name" required=""></td>
	</tr>
	<tr>
			<td>GENDER</td>
			<td><input type="radio" name="gen" value="male" checked="">Male
				<input type="radio" name="gen" value="female">Female</td>

		</tr>
			<tr>
			<td>FIELD</td>
		<td><input type="text" name="field" required=""  class="form-control"></td>
		<tr>
			<td>TIME SLOT</td>
		<td><input type="time" name="timeslot" required="" class="form-control"></td>


	</tr>
        <tr>
			<td>FEES</td>
		<td><input type="number" name="pay" required="" class="form-control"></td>


	</tr>
        <tr>
            <td>PASSWORD</td>
            <td><input type="password" name="pwd" required="" class="form-control"></td>
        </tr>
        <tr>
			<td></td>
			<td><input type="submit" name="submit" class="form-control btn-primary p-2" value="submit" ></td>
		</tr>
		</table>
    {% if msg %}
    <script>
        alert('successfully registered')
    </script>
    {% endif %}
	</form>
</center>
</body>
</html>
{% endblock %}
