{% extends 'temp/User.html' %}
{% block base %}
<!DOCTYPE html>
<html>
<head>
	<title>VIEW EMERGENCY</title>
	</head>
<body><center><h1>VIEW EMERGENCY</h1>

		<tr>
			<th>Contact</th>
			<th>Name</th>
			<th>Service</th>
		</tr>
        {% for i in x %}

			<td>{{ i.contact }}</td>

			<td>{{ i.service }}</td>
		</tr>
         {% endfor %}
	</table>
</center>
</body>
</html>
{% endblock %}
