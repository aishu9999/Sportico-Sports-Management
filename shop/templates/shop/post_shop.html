{% extends 'temp/home.html' %}
{% block base %}
<!DOCTYPE html>
<html>
<head>
	<title>SHOP NAME</title>
</head>
<body>
<center>
	<h1>SHOP NAME</h1>
<form method="post">
    {% csrf_token %}
	<table style="width: 300px;">
		<tr>
{#			<td>SHOP NAME</td>#}
		<td><input type="text" name="shopname" required="" class="form-control" placeholder="Shop name"></td>
	</tr>
        <tr>
{#            <td>Address</td>#}
            <td><textarea name="add" rows="4" class="form-control" placeholder="address"></textarea> </td>
        </tr>
        <tr>
{#            <td>Conatct</td>#}
            <td><input type="text" name="phone" pattern="[0-9]{10}" class="form-control" placeholder="contact"></td>
        </tr>
				<tr>
{#				<td>USERNAME:</td>#}
				<td><input type="text" name="username" required="" class="form-control" placeholder="User name"></td>
			</tr>
			<tr>
{#				<td>PASSWORD:</td>#}
				<td><input type="password" name="password" required="" class="form-control" placeholder="password"></td>
			</tr>
		<tr>
{#			<td></td>#}
			<td><input type="submit" name="shop" value="submit" class="btn-primary form-control"></td>
		</tr>
		</table>
     {% if msg %}
    <script>
        alert('Successfully registered')
    </script>
    {% endif %}
	</form>
</center>
</body>
</html>
{% endblock %}
