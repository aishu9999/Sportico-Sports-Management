{% extends 'temp/User.html' %}
{% block base %}
<!DOCTYPE html>
<html>
<head>
	<title>PAYMENT</title>
</head>
<body>
<center>
	<h1>PAYMENT</h1>
<form method="post">
    {% csrf_token %}
	<table>
		<tr>
{#			<td>CARD HOLDER NAME</td>#}
		<td><input type="text" name="cname" class="form-control" placeholder="CARD HOLDER NAME" required=""></td>
	</tr>
        <tr>
{#            <td>ACCOUNT NUMBER</td>#}
            <td><input type="text" name="anum" class="form-control" placeholder="ACCOUNT NUMBER" required="" minlength="12" maxlength="12"></td>
        </tr>
        <tr>
{#            <td>CVV</td>#}
            <td><input type="text" name="cvv" required="" minlength="3" class="form-control" placeholder="CVV" maxlength="3"></td>
        </tr>

	<tr>

{#			<td>AMOUNT</td>#}
		<td><input type="text" name="amount" required="" readonly value="{{ kk.amount }}" class="form-control"></td>
		</tr>

<tr>
{#			<td></td>#}
			<td><input type="submit" class="btn-primary form-control" value="Pay"></td>
		</tr>
		</table>
	</form>
</center>
</body>
</html>
{% endblock %}
