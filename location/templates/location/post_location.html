<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Location</title>
</head>
<body>
<center>
 <h1>LOCATION</h1>
<form method="post">
    {% csrf_token %}
    <table>
		<tr>
			<td>CLUB NAME</td>
			<td><select name="cl" required="">
                {% for i in x %}
            <option value="{{ i.club_id}}">{{ i.clubname }}</option>
            {% endfor %}
            </select></td>
		</tr>
        <tr>
			<td>LATITUDE</td>
			<td><input type="text" name="latitude" required=""></td>
		</tr>
		<tr>
			<td>LONGITUDE</td>
			<td><input type="text" name="longitude" required=""></td>
		</tr>
        <tr>
			<td></td>
			<td><input type="submit" name="location" value="upload"></td>
		</tr>
    </table>
</form>
</center>
</body>
</html>
